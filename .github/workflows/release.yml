
name: REL

on:
  push:
    tags: ["v[0-9]*"]

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    steps:

      - name: Checkout code
        id: checkout
        uses: actions/checkout@v4

      - name: Build tarball
        id: build
        run: |
          make checkver
          make dist
          EXTENSION=$(grep ^EXTENSION Makefile | sed 's/.*= *//')
          EXT_VERSION=$(grep ^EXT_VERSION Makefile | sed 's/.*= *//')
          test "${{github.ref}}" = "refs/tags/v${EXT_VERSION}" || { echo "ERR: tag mismatch"; exit 1; }
          echo "EXTENSION=${EXTENSION}" >> $GITHUB_ENV
          echo "EXT_VERSION=${EXT_VERSION}" >> $GITHUB_ENV
          echo "TGZ=${EXTENSION}-${EXT_VERSION}.tar.gz" >> $GITHUB_ENV

      - name: Create release
        id: release
        env:
          GITHUB_TOKEN: ${{secrets.GITHUB_TOKEN}}
        run: |
          gh release create "${{github.ref_name}}" "${{env.TGZ}}" \
            --title "${{github.event.repository.name}} ${{github.ref_name}}" \
            --notes-file "docs/notes/${{github.ref_name}}.md"

